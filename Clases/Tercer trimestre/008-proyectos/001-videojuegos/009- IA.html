<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Vampire Survivors Clone - DAW Edition</title>
    <style>
        body {
            background: #050505;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        /* Interfaz de usuario (HUD) */
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px #000;
            z-index: 10;
        }

        /* Barras de Vida y XP */
        .bar-container {
            width: 250px;
            height: 15px;
            background: #333;
            border: 1px solid #fff;
            margin-top: 5px;
            overflow: hidden;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: #ff4444;
            transition: width 0.1s;
        }

        #xp-bar {
            width: 0%;
            height: 100%;
            background: #44ff44;
            transition: width 0.1s;
        }

        /* Menú de Mejoras (Modal) */
        #menu-mejoras {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #00ffff;
            padding: 30px;
            display: none;
            flex-direction: column;
            gap: 15px;
            color: white;
            text-align: center;
            z-index: 100;
            min-width: 300px;
        }

        .boton-mejora {
            background: #111;
            border: 2px solid #fff;
            color: white;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            font-size: 16px;
        }

        .boton-mejora:hover {
            background: #00ffff;
            color: #000;
            border-color: #00ffff;
        }
    </style>
</head>

<body>

    <div id="ui">
        KILLS: <span id="contador">0</span> | NIVEL: <span id="nivel-txt">1</span>
        <div>HP</div>
        <div class="bar-container">
            <div id="hp-bar"></div>
        </div>
        <div>XP</div>
        <div class="bar-container">
            <div id="xp-bar"></div>
        </div>
    </div>

    <div id="menu-mejoras">
        <h2 style="color: #00ffff; margin-top: 0;">¡NIVEL SUBIDO!</h2>
        <p>Selecciona una evolución:</p>
        <div id="opciones-mejoras" style="display: flex; flex-direction: column; gap: 10px;"></div>
    </div>

    <canvas id="juego"></canvas>

    <script>
        const lienzo = document.getElementById("juego");
        const ctx = lienzo.getContext("2d");
        const menuMejoras = document.getElementById("menu-mejoras");
        const opcionesMejoras = document.getElementById("opciones-mejoras");

        // --- ESTADÍSTICAS INICIALES ---
        const PLAYER_STATS = {
            hp: 100, maxHp: 100,
            vel: 4,
            danoBala: 1,
            cadencia: 600, // ms entre disparos
            rangoRecogida: 70,
            xp: 0, xpSiguiente: 5, nivel: 1
        };

        // --- VARIABLES DE ESTADO ---
        let enemigos = []; let balas = []; let gemas = []; let teclas = {};
        let frames = 0; let kills = 0; let juegoPausado = false;
        let lastShot = 0;
        let jugadorPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

        // Carga de Sprites
        const imgJugador = new Image(); imgJugador.src = "sprite.png";
        const imgNpc = new Image(); imgNpc.src = "spritenpc.gif";

        // --- DEFINICIÓN DE MEJORAS ---
        const MEJORAS = [
            { nombre: "Botas de Hermes", desc: "+1 Velocidad de movimiento", efecto: () => PLAYER_STATS.vel += 1 },
            { nombre: "Munición Pesada", desc: "+1 Daño por impacto", efecto: () => PLAYER_STATS.danoBala += 1 },
            { nombre: "Recarga Rápida", desc: "-100ms Tiempo de recarga", efecto: () => PLAYER_STATS.cadencia = Math.max(150, PLAYER_STATS.cadencia - 100) },
            { nombre: "Imán Potente", desc: "+50 Rango de recogida", efecto: () => PLAYER_STATS.rangoRecogida += 50 },
            { nombre: "Poción de Vida", desc: "Cura 40 HP", efecto: () => PLAYER_STATS.hp = Math.min(PLAYER_STATS.maxHp, PLAYER_STATS.hp + 40) }
        ];

        // --- FUNCIONES DE MEJORA ---
        function mostrarMenuMejoras() {
            juegoPausado = true;
            menuMejoras.style.display = "flex";
            opcionesMejoras.innerHTML = "";

            // Elegir 3 opciones aleatorias
            const barajadas = [...MEJORAS].sort(() => 0.5 - Math.random()).slice(0, 3);

            barajadas.forEach(mejora => {
                const btn = document.createElement("button");
                btn.className = "boton-mejora";
                btn.innerHTML = `<strong>${mejora.nombre}</strong><br><small>${mejora.desc}</small>`;
                btn.onclick = () => {
                    mejora.efecto();
                    juegoPausado = false;
                    menuMejoras.style.display = "none";
                    requestAnimationFrame(bucle);
                };
                opcionesMejoras.appendChild(btn);
            });
        }

        // --- BUCLE PRINCIPAL ---
        function bucle(timestamp) {
            if (juegoPausado) return;

            ctx.clearRect(0, 0, lienzo.width, lienzo.height);
            frames++;

            // 1. Movimiento Jugador
            if (teclas['w'] && jugadorPos.y > 20) jugadorPos.y -= PLAYER_STATS.vel;
            if (teclas['s'] && jugadorPos.y < lienzo.height - 20) jugadorPos.y += PLAYER_STATS.vel;
            if (teclas['a'] && jugadorPos.x > 20) jugadorPos.x -= PLAYER_STATS.vel;
            if (teclas['d'] && jugadorPos.x < lienzo.width - 20) jugadorPos.x += PLAYER_STATS.vel;

            // 2. Disparo Automático (al enemigo más cercano)
            if (timestamp - lastShot > PLAYER_STATS.cadencia && enemigos.length > 0) {
                let cercano = enemigos[0];
                let minDist = Infinity;
                enemigos.forEach(e => {
                    let d = Math.hypot(jugadorPos.x - e.x, jugadorPos.y - e.y);
                    if (d < minDist) { minDist = d; cercano = e; }
                });

                const angle = Math.atan2(cercano.y - jugadorPos.y, cercano.x - jugadorPos.x);
                balas.push({
                    x: jugadorPos.x, y: jugadorPos.y,
                    vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10,
                    activa: true
                });
                lastShot = timestamp;
            }

            // 3. Dibujar Gemas y Recogida
            gemas.forEach((g, i) => {
                ctx.fillStyle = "#44ff44";
                ctx.fillRect(g.x - 4, g.y - 4, 8, 8);

                const distJugador = Math.hypot(jugadorPos.x - g.x, jugadorPos.y - g.y);
                if (distJugador < PLAYER_STATS.rangoRecogida) {
                    PLAYER_STATS.xp++;
                    document.getElementById("xp-bar").style.width = (PLAYER_STATS.xp / PLAYER_STATS.xpSiguiente * 100) + "%";
                    gemas.splice(i, 1);

                    if (PLAYER_STATS.xp >= PLAYER_STATS.xpSiguiente) {
                        PLAYER_STATS.nivel++;
                        PLAYER_STATS.xp = 0;
                        PLAYER_STATS.xpSiguiente = Math.floor(PLAYER_STATS.xpSiguiente * 1.4);
                        document.getElementById("nivel-txt").innerText = PLAYER_STATS.nivel;
                        mostrarMenuMejoras();
                    }
                }
            });

            // 4. Dibujar Jugador
            ctx.drawImage(imgJugador, jugadorPos.x - 25, jugadorPos.y - 25, 50, 50);

            // 5. Gestión de Balas
            balas.forEach((b, bi) => {
                b.x += b.vx; b.y += b.vy;
                ctx.fillStyle = "#00ffff";
                ctx.fillRect(b.x - 3, b.y - 3, 6, 6);

                if (b.x < 0 || b.x > lienzo.width || b.y < 0 || b.y > lienzo.height) b.activa = false;

                enemigos.forEach(en => {
                    if (Math.hypot(b.x - en.x, b.y - en.y) < 25) {
                        en.hp -= PLAYER_STATS.danoBala;
                        en.lastHit = Date.now(); // Marca el tiempo del impacto para el brillo
                        b.activa = false;
                        if (en.hp <= 0 && !en.muerto) {
                            en.muerto = true;
                            kills++;
                            document.getElementById("contador").innerText = kills;
                            gemas.push({ x: en.x, y: en.y });
                        }
                    }
                });
            });
            balas = balas.filter(b => b.activa);
            enemigos = enemigos.filter(en => !en.muerto);

            // 6. Gestión de Enemigos
            if (frames % Math.max(20, 60 - PLAYER_STATS.nivel * 2) === 0) {
                const lado = Math.floor(Math.random() * 4);
                let ex, ey;
                if (lado === 0) { ex = Math.random() * lienzo.width; ey = -30; }
                else if (lado === 1) { ex = Math.random() * lienzo.width; ey = lienzo.height + 30; }
                else if (lado === 2) { ex = -30; ey = Math.random() * lienzo.height; }
                else { ex = lienzo.width + 30; ey = Math.random() * lienzo.height; }

                enemigos.push({ x: ex, y: ey, hp: 1 + Math.floor(PLAYER_STATS.nivel / 3), lastHit: 0, muerto: false });
            }

            enemigos.forEach(en => {
                const angle = Math.atan2(jugadorPos.y - en.y, jugadorPos.x - en.x);
                en.x += Math.cos(angle) * 1.8;
                en.y += Math.sin(angle) * 1.8;

                // --- CORRECCIÓN DEL BRILLO ---
                if (Date.now() - en.lastHit < 100) {
                    ctx.filter = "brightness(3) contrast(1.2)";
                } else {
                    ctx.filter = "none";
                }

                ctx.drawImage(imgNpc, en.x - 20, en.y - 20, 40, 40);
                ctx.filter = "none";

                // Daño al jugador por contacto
                if (Math.hypot(jugadorPos.x - en.x, jugadorPos.y - en.y) < 30) {
                    PLAYER_STATS.hp -= 0.3;
                    document.getElementById("hp-bar").style.width = Math.max(0, (PLAYER_STATS.hp / PLAYER_STATS.maxHp * 100)) + "%";
                    if (PLAYER_STATS.hp <= 0) {
                        alert("GAME OVER - Kills: " + kills);
                        location.reload();
                    }
                }
            });

            requestAnimationFrame(bucle);
        }

        // Manejo de ventana y controles
        function ajustar() {
            lienzo.width = window.innerWidth;
            lienzo.height = window.innerHeight;
            jugadorPos.x = lienzo.width / 2;
            jugadorPos.y = lienzo.height / 2;
        }
        window.addEventListener("resize", ajustar);
        window.addEventListener("keydown", e => teclas[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", e => teclas[e.key.toLowerCase()] = false);

        ajustar();
        requestAnimationFrame(bucle);
    </script>
</body>

</html>
